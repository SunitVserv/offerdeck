<script type="text/javascript" nonce="6bca354esrc4d79b1t7r8a5c903tdte008ae27cf7bcyfbcca4">
// Check if the user has accepted cookies
console.log(localStorage.getItem('cookieAccepted_offerdeck'));
if (!localStorage.getItem('cookieAccepted_offerdeck')) {
    // Display the cookie banner
    document.getElementById('cookie-popup').style.display = 'block';
}

var cookieCTA = document.getElementById("cookie-cta");
cookieCTA.addEventListener("click", function (event) {
	acceptCookies();
});	

// Function to set the cookie flag when the user accepts cookies
function acceptCookies() {
    // Set a flag in localStorage
    localStorage.setItem('cookieAccepted_offerdeck', true);

    // Hide the cookie banner
    document.getElementById('cookie-popup').style.display = 'none';
}
</script>
